name: Release readiness

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact Python package version to verify (for example, 0.2.0)
        required: true
        type: string

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  release-readiness:
    name: release-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare the external evidence directory
        shell: bash
        run: |
          set -euo pipefail
          run_root="${RUNNER_TEMP}/release-readiness"
          status_file="${RUNNER_TEMP}/release-readiness-exit-code.txt"
          mkdir -p "${run_root}"
          printf 'gate_not_started\n' > "${run_root}/bootstrap-status.txt"
          printf 'RUN_ROOT=%s\n' "${run_root}" >> "${GITHUB_ENV}"
          printf 'GATE_STATUS_FILE=%s\n' "${status_file}" >> "${GITHUB_ENV}"

      - name: Check out the source commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/locks/ci-py311.txt
            requirements/locks/ci-services-py311.txt

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Install the pinned npm and uv versions
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.4
          python -m pip install uv==0.9.21
          test "$(npm --version | cut -d. -f1)" = "10"
          test "$(uv --version | awk '{print $2}')" = "0.9.21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run the clean-clone release gate and save its exit code
        id: release_gate
        shell: bash
        run: |
          set +e
          BR_RELEASE_GATE_PIP_CACHE_DIR="$(python -m pip cache dir)" \
            scripts/ci/clean_clone_gate.sh \
            --release-version "${RELEASE_VERSION}" \
            --output-dir "${RUN_ROOT}"
          gate_status=$?
          set -e
          printf '%s\n' "${gate_status}" > "${GATE_STATUS_FILE}"
          printf 'gate_exit_code=%s\n' "${gate_status}" > "${RUN_ROOT}/bootstrap-status.txt"
          printf 'exit_code=%s\n' "${gate_status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload the release-readiness evidence bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ inputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Propagate the saved release-gate status
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          gate_status="$(cat "${GATE_STATUS_FILE}" 2>/dev/null || printf '255')"
          if [[ ! "${gate_status}" =~ ^[0-9]+$ ]] || [[ "${gate_status}" -gt 255 ]]; then
            exit 255
          fi
          exit "${gate_status}"
