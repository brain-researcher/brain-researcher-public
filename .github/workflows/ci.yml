name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  clean-install:
    name: clean-install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/core-py311.txt
      - name: Verify a clean base install and public CLI help
        run: >-
          BR_CLEAN_INSTALL_PIP_CACHE_DIR="$(python -m pip cache dir)"
          scripts/setup/smoke_clean_install.sh core

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run the PR unit smoke shard
        run: tests/run_tests.sh unit-pr-smoke

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run configuration and public contract checks
        run: tests/run_tests.sh contracts

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run verifier and focused pack checks
        run: tests/run_tests.sh reproducibility

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Build strict documentation and check internal links
        run: |
          python -m mkdocs build --strict --clean
          python -m pytest -q tests/unit/config/test_docs_integrity.py \
            --noconftest -p no:cacheprovider

  services:
    name: services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-services-py311.txt
      - name: Install the focused CI services profile
        run: |
          python -m pip install -r requirements/locks/ci-services-py311.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci-services]"
          python -m pip check
      - name: Run focused service checks
        run: tests/run_tests.sh services

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Set up Node 20 and npm 10
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - name: Verify the supported Node and npm majors
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "20"
          test "$(npm --version | cut -d. -f1)" = "10"
      - name: Install the Web UI from its lockfile
        run: npm --prefix apps/web-ui ci
      - name: Lint, test, build, and validate the Web UI
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: tests/run_tests.sh web

  deployment-static:
    name: deployment-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/locks/ci-py311.txt
      - name: Install the CI Python profile
        run: |
          python -m pip install -r requirements/locks/ci-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Validate inspectable deployment assets without starting services
        run: tests/run_tests.sh deployment-static
