# Non-runnable Secret key contract for the experimental raw manifests.
# Values are intentionally empty in the public repository. Create these Secrets
# in a private deployment workspace with Sealed Secrets, External Secrets, Vault,
# or another reviewed secret-management workflow before using the manifests.

---
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: llm-api-keys
    app.kubernetes.io/component: secrets
  annotations:
    # Kubernetes automatically adds this annotation for Opaque secrets
    # sealedsecrets.bitnami.com/managed: "true"  # Uncomment if using Sealed Secrets
type: Opaque
stringData:
  # Required LLM API key names. Supply values outside the public repository.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  
  # Additional LLM providers (if needed)
  HUGGINGFACE_API_KEY: ""
  COHERE_API_KEY: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: brain-researcher-data
  labels:
    app.kubernetes.io/name: database-credentials
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Required PostgreSQL credential names. Supply values externally.
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
  POSTGRES_ROOT_PASSWORD: ""
  
  # Redis credentials (if authentication is enabled)
  REDIS_PASSWORD: ""
  
  # Connection strings
  POSTGRES_URL: ""
  REDIS_URL: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: jwt-secrets
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Required JWT signing secret names. Generate values externally.
  JWT_SECRET_KEY: ""
  JWT_REFRESH_SECRET: ""
  
  # Session secrets
  SESSION_SECRET: ""
  COOKIE_SECRET: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-auth
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: mcp-auth
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Shared token for in-cluster MCP HTTP access.
  # Clients must send: Authorization: Bearer <token>
  BR_MCP_AUTH_TOKEN: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificates
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: tls-certificates
    app.kubernetes.io/component: secrets
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"  # If using cert-manager
type: kubernetes.io/tls
stringData:
  # Required TLS key names. Use cert-manager or another reviewed issuer.
  tls.crt: ""
  tls.key: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: oauth-credentials
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: oauth-credentials
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # OAuth provider credentials
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  
  ORCID_CLIENT_ID: ""
  ORCID_CLIENT_SECRET: ""
  
  # OAuth redirect URLs
  OAUTH_REDIRECT_URL: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-credentials
  namespace: brain-researcher-monitoring
  labels:
    app.kubernetes.io/name: monitoring-credentials
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Grafana admin credentials
  GF_SECURITY_ADMIN_PASSWORD: ""
  GF_SECURITY_SECRET_KEY: ""
  
  # Prometheus credentials (if basic auth is enabled)
  PROMETHEUS_USERNAME: ""
  PROMETHEUS_PASSWORD: ""
  
  # AlertManager credentials
  ALERTMANAGER_USERNAME: ""
  ALERTMANAGER_PASSWORD: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: external-services
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: external-services
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # External service API keys and credentials
  SUPABASE_URL: ""
  SUPABASE_ANON_KEY: ""
  SUPABASE_SERVICE_KEY: ""
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  SUPABASE_OAUTH_PROVIDERS: ""
  NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: ""
  SUPABASE_JWKS_URL: ""
  SUPABASE_JWT_ISSUER: ""
  SUPABASE_JWT_AUDIENCE: ""
  
  # Email service credentials (if using SMTP)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  
  # Object storage credentials (if using S3-compatible storage)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  S3_BUCKET_NAME: ""
  S3_REGION: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-credentials
  namespace: brain-researcher-core
  labels:
    app.kubernetes.io/name: model-registry-credentials
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Model registry and container registry credentials
  DOCKER_REGISTRY_USERNAME: ""
  DOCKER_REGISTRY_PASSWORD: ""
  DOCKER_REGISTRY_EMAIL: ""
  
  # Hugging Face Hub credentials
  HF_TOKEN: ""
  
  # MLflow registry credentials (if using external MLflow)
  MLFLOW_TRACKING_URI: ""
  MLFLOW_USERNAME: ""
  MLFLOW_PASSWORD: ""

