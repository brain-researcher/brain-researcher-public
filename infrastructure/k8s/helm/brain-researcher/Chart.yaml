apiVersion: v2
name: brain-researcher
description: Experimental Helm rendering scaffold for static inspection of the Brain Researcher service stack.
type: application
version: 0.2.0
appVersion: "0.2.0-oss-preview"

maintainers:
  - name: Brain Researcher Team
    url: https://github.com/brain-researcher/brain-researcher-public

keywords:
  - neuroimaging
  - neuroscience
  - knowledge-graph

home: https://github.com/brain-researcher/brain-researcher-public
sources:
  - https://github.com/brain-researcher/brain-researcher-public

annotations:
  category: "Analytics"
  licenses: "MIT"
  "artifacthub.io/prerelease": "true"
  "artifacthub.io/links": |
    - name: Source
      url: https://github.com/brain-researcher/brain-researcher-public
    - name: Deployment status
      url: https://github.com/brain-researcher/brain-researcher-public/tree/main/infrastructure/deployment
  "artifacthub.io/images": |
    - name: neo4j
      image: neo4j:5.22.0
    - name: postgres
      image: postgres:15-alpine
    - name: postgres-exporter
      image: prometheuscommunity/postgres-exporter:v0.15.0
    - name: redis
      image: redis:7-alpine
    - name: redis-exporter
      image: oliver006/redis_exporter:v1.62.0
  "artifacthub.io/changes": |
    - kind: changed
      description: Align the preview image contract with software release v0.2.0.
    - kind: changed
      description: Mark the chart as an experimental static-rendering scaffold.
    - kind: fixed
      description: Render explicit repositories and fixed tags without leading-slash image references.
    - kind: security
      description: Require pre-created Secret references and render no Secret resources.
  "artifacthub.io/readme": |
    # Brain Researcher Helm chart

    This chart is an experimental scaffold for `helm lint` and `helm template`
    inspection. It is not a supported installation or production deployment
    target.

    Brain Researcher application image references use fixed preview tags so the
    rendered contract is deterministic, but the project does not publish or
    support a corresponding production image set. The chart also renders no
    Secret resources. Any operator evaluating the output must supply their own
    images, pre-create the Secret names and keys declared in `values.yaml`, and
    independently validate storage, ingress, security, and health behavior.

    Use the repository's root Docker Compose workflow for supported local
    development.

dependencies: []
deprecated: false
kubeVersion: ">=1.20.0-0"
