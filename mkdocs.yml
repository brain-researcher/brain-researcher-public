site_name: Brain Researcher Documentation
site_description: A neuroimaging analysis platform combining LLM-powered natural language understanding with advanced fMRI analysis tools
site_author: Brain Researcher Team
site_url: https://brain-researcher.readthedocs.io

# Repository
repo_name: brain-researcher-public
repo_url: https://github.com/brain-researcher/brain-researcher-public
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/brain

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: brain-researcher
      repo: brain-researcher-public
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Environment: ENVIRONMENT_SETUP.md
  - MCP: mcp.md
  - Operations: OPERATIONS.md
  - Reproducibility: reproducibility_packs.md
  - Contracts: contract-tiers.md
  - HPC: hpc.md
  - Tool Contribution: how-to-add-tool.md
  - Audit Results:
      - BR-KG Manual Validation: results/br_kg_manual_validation_20260805/README.md
      - Methods and Boundaries: results/br_kg_manual_validation_20260805/METHODS.md
      - Source Attribution: results/br_kg_manual_validation_20260805/source_attribution.md
  - Appendices:
      - Overview: appendices/00_index.md
      - Episode Control Plane: appendices/01_appendix_A_episode_control_plane.md
      - Evidence Bundle: appendices/02_appendix_B_evidence_bundle.md
      - Dataset Resource: appendices/03_appendix_C_dataset_resource.md
      - Tool Registry: appendices/04_appendix_D_tool_registry.md
      - Constraint Commitment: appendices/05_appendix_E_constraint_commitment.md
      - Run Bundle Provenance: appendices/06_appendix_F_run_bundle_provenance.md
      - Review: appendices/07_appendix_G_review.md
      - Memory: appendices/08_appendix_H_memory.md
      - Operational Mode: appendices/09_appendix_I_operational_mode.md
      - Evaluation: appendices/10_appendix_J_evaluation.md
  - Use Cases:
      - BR-KG Plot Probe: use_cases/br_kg_plot_probe_20260502/SUMMARY.md
      - Historical A1 Report: use_cases/bounded_autoresearch_a1_2026-04-30/BOUNDED_AUTORESEARCH_CASE_REPORT.md

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brain-researcher/brain-researcher-public
  version:
    provider: mike
    default: stable

# Extra JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
