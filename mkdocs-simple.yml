site_name: Brain Researcher Documentation
site_description: A neuroimaging analysis platform combining LLM-powered natural language understanding with advanced fMRI analysis tools
site_author: Brain Researcher Team

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

# Basic plugins
plugins:
  - search

# Navigation
nav:
  - Home: index-simple.md
  - Environment: ENVIRONMENT_SETUP.md
  - MCP: mcp.md
  - Operations: OPERATIONS.md
  - Reproducibility: reproducibility_packs.md
  - Contracts: contract-tiers.md
  - HPC: hpc.md
  - Tool Contribution: how-to-add-tool.md
  - Audit Results:
      - BR-KG Manual Validation: results/br_kg_manual_validation_20260805/README.md
      - Methods and Boundaries: results/br_kg_manual_validation_20260805/METHODS.md
      - Source Attribution: results/br_kg_manual_validation_20260805/source_attribution.md
  - Appendices:
      - Overview: appendices/00_index.md
      - Episode Control Plane: appendices/01_appendix_A_episode_control_plane.md
      - Evidence Bundle: appendices/02_appendix_B_evidence_bundle.md
      - Dataset Resource: appendices/03_appendix_C_dataset_resource.md
      - Tool Registry: appendices/04_appendix_D_tool_registry.md
      - Constraint Commitment: appendices/05_appendix_E_constraint_commitment.md
      - Run Bundle Provenance: appendices/06_appendix_F_run_bundle_provenance.md
      - Review: appendices/07_appendix_G_review.md
      - Memory: appendices/08_appendix_H_memory.md
      - Operational Mode: appendices/09_appendix_I_operational_mode.md
      - Evaluation: appendices/10_appendix_J_evaluation.md
  - Use Cases:
      - BR-KG Plot Probe: use_cases/br_kg_plot_probe_20260502/SUMMARY.md
      - Historical A1 Report: use_cases/bounded_autoresearch_a1_2026-04-30/BOUNDED_AUTORESEARCH_CASE_REPORT.md

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
